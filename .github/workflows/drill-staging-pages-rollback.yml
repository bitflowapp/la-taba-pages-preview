name: Drill isolated Staging Pages rollback

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type staging-only to confirm the isolated Pages rollback drill'
        required: true
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: drill-staging-pages-rollback
  cancel-in-progress: false

jobs:
  drill:
    if: ${{ github.repository == 'bitflowapp/la-taba-pages-preview' && github.ref_name == 'release/taba-commercial-pilot' && inputs.confirm == 'staging-only' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out exact release SHA
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm

      - name: Require exact green CI and current branch tip
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin release/taba-commercial-pilot
          [[ "$(git rev-parse origin/release/taba-commercial-pilot)" == "$GITHUB_SHA" ]]
          node scripts/deploy/check-staging-pilot-ci.mjs

      - name: Install and build Staging-only candidate
        run: |
          npm ci --no-audit --no-fund
          node scripts/deploy/preparar-staging-pilot.mjs --commit "$GITHUB_SHA"

      - name: Verify compatible rollback target before writing
        id: preflight
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: node scripts/deploy/drill-staging-pages-rollback.mjs preflight

      - name: Verify exact Cloudflare Staging project
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: node scripts/deploy/check-cloudflare-staging-target.mjs

      - name: Deploy a compatible second Staging version
        id: deploy
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          npx --yes wrangler@4 pages deploy dist_staging_pilot \
            --project-name taba2-staging --branch staging \
            --commit-hash "$GITHUB_SHA"

      - name: Confirm second Staging version was public
        run: |
          runtime="$(node -p "require('./dist_staging_pilot/version.json').runtime")"
          node scripts/deploy/verificar-staging-pilot.mjs --commit "$GITHUB_SHA" --runtime "$runtime"

      - name: Roll back only Staging to the previous compatible version
        if: ${{ always() && steps.preflight.outcome == 'success' && steps.deploy.outcome != 'skipped' }}
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ROLLBACK_DEPLOYMENT_ID: ${{ steps.preflight.outputs.rollback_id }}
        run: |
          node scripts/deploy/drill-staging-pages-rollback.mjs rollback
          node scripts/deploy/verificar-staging-pilot.mjs \
            --commit bcea25fd8d3ffe088dbf6ea6f3bfa2dbc3b79852 \
            --runtime la-taba-runtime-v114-commercial-pilot
