name: Local agent (.NET)

# Spike del agente local de Windows (impresión y hardware). Corre sólo cuando
# cambia el agente: no toca el gate web ni el de Supabase.
on:
  push:
    branches:
      - 'spike/**'
    paths:
      - 'agents/windows-local-agent/**'
      - '.github/workflows/local-agent-dotnet.yml'
  pull_request:
    paths:
      - 'agents/windows-local-agent/**'
      - '.github/workflows/local-agent-dotnet.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: local-agent-dotnet-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Restore, build and test (.NET 10 LTS, Windows)
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: agents/windows-local-agent
    steps:
      - name: Check out exact candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up .NET from global.json
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5.4.0
        with:
          global-json-file: agents/windows-local-agent/global.json

      - name: Restore
        run: dotnet restore Taba.LocalAgent.sln

      - name: Build (analyzers, warnings as errors)
        run: dotnet build Taba.LocalAgent.sln -c Release --no-restore

      - name: Test
        run: dotnet test Taba.LocalAgent.sln -c Release --no-build --logger "trx;LogFileName=local-agent.trx" --results-directory TestResults

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: local-agent-test-results-${{ github.sha }}
          path: agents/windows-local-agent/TestResults
          if-no-files-found: warn
          retention-days: 14
