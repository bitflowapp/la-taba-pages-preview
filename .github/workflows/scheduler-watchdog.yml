# Sonda externa del planificador de TABA2.
#
# El barrido de alertas detecta todo lo demás, pero no puede denunciar su propia
# ausencia: si pg_cron deja de ejecutarlo, no queda nadie adentro para decirlo.
# Este flujo es un reloj de afuera, en una infraestructura que este repositorio
# ya usa, y con algo que ninguna de las otras capas tiene: cuando falla, GitHub
# le manda un correo a quien es dueño del repositorio.
#
# QUÉ HACE FALTA PARA QUE CORRA: nada.
#
# Antes hacían falta dos cosas cargadas a mano —la variable `SUPABASE_URL` y el
# secreto `SUPABASE_ANON_KEY`— y como no estaban, esto llevaba 133 corridas
# fallando, una cada diez minutos, durante días. Un vigía que no arranca es peor
# que no tener vigía: ocupa el lugar y nadie busca otro.
#
# Ahora la sonda cae al `runtime-config.js` del sitio publicado, que es de donde
# CUALQUIER navegador saca esos mismos dos datos. La clave es publicable por
# diseño y la autoridad real es RLS, no la clave. Comprobado contra el servidor:
# la RPC contesta 200 con ella.
#
# Si igual se prefiere la fuente explícita, gana sobre la publicada:
#   · variable de repositorio `SUPABASE_URL`  (Settings → Variables)
#   · secreto de repositorio  `SUPABASE_ANON_KEY` (Settings → Secrets)
# La URL va como VARIABLE, no como secreto: es pública y marcarla secreta sólo
# esconde información de quien opera.
#
# LÍMITES, dichos de frente: GitHub no garantiza el minuto exacto de una tarea
# programada (puede atrasarse en horas de carga) y desactiva las tareas
# programadas de un repositorio sin actividad durante 60 días. Por eso esta capa
# acompaña a las otras dos —la sonda de Cloudflare y la comprobación que dispara
# el tráfico real— en vez de reemplazarlas.

name: Scheduler watchdog

on:
  schedule:
    # Cada diez minutos. Con el umbral de 600 s del servidor, la muerte del
    # planificador se descubre en 20 minutos como máximo por esta vía.
    - cron: '*/10 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: scheduler-watchdog
  cancel-in-progress: true

jobs:
  probe:
    name: ¿El barrido de alertas sigue corriendo?
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # Sonda e informe viven en el repositorio y tienen pruebas. El informe ya
      # había salido de acá adentro —era un `python3 -c '…'` con comillas
      # escapadas dentro de un bloque de shell—; la resolución de configuración
      # y la consulta se quedaron, y eran el único tramo del camino sin forma de
      # ejercitarlo. Justo el que decide si el vigía existe.
      - name: Traer la sonda
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          sparse-checkout: |
            scripts/scheduler-watchdog-probe.mjs
            scripts/scheduler-watchdog-report.mjs
          sparse-checkout-cone-mode: false

      - name: Preguntarle al servidor por su propio reloj
        env:
          # Vacías no rompen nada: la sonda cae al runtime-config publicado y
          # dice en el log de dónde sacó la configuración.
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: node scripts/scheduler-watchdog-probe.mjs
