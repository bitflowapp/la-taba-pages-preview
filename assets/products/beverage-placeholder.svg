<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" role="img" aria-labelledby="title desc">
  <title id="title">Foto de producto próximamente</title>
  <desc id="desc">Marcador propio de La Taba para un producto que todavía no tiene una foto autorizada: siluetas de una botella y una lata y la leyenda «Foto próximamente».</desc>
  <g fill="none" stroke="#b3a99b" stroke-width="15" stroke-linecap="round" stroke-linejoin="round">
    <!-- Botella -->
    <rect x="330" y="206" width="78" height="30" rx="9"/>
    <path d="M341 236h56v92c0 46 62 74 62 158v248c0 22-18 40-40 40H319c-22 0-40-18-40-40V486c0-84 62-112 62-158Z"/>
    <rect x="304" y="524" width="130" height="150" rx="16"/>
    <!-- Lata -->
    <path d="M548 332h172c13 0 24 11 24 24v372c0 13-11 24-24 24H548c-13 0-24-11-24-24V356c0-13 11-24 24-24Z"/>
    <path d="M530 372h208M530 716h208"/>
    <rect x="548" y="470" width="172" height="130" rx="14"/>
  </g>
  <text x="500" y="868" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="74" font-weight="700" letter-spacing="2" fill="#6b6155">Foto próximamente</text>
</svg>
