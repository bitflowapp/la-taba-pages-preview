<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="robots" content="noindex" />
    <meta name="theme-color" content="#11151b" />
    <title>La Taba · Volvemos pronto</title>
    <style>
      :root { color-scheme: dark; --bg: #11151b; --ink: #f4f1ea; --soft: #b9b4aa; --brand: #e02a2a; }
      * { box-sizing: border-box; }
      html, body { margin: 0; min-height: 100%; background: var(--bg); color: var(--ink); }
      body { display: grid; place-items: center; min-height: 100vh; padding: 24px 16px;
        font: 400 1.05rem/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
      main { max-width: 32rem; text-align: center; }
      .marca { font-weight: 800; font-style: italic; font-size: 2.4rem; letter-spacing: -0.02em; margin: 0 0 0.25rem; }
      .marca::after { content: ""; display: block; width: 3.5rem; height: 4px; margin: 0.4rem auto 0; background: var(--brand); border-radius: 2px; }
      h1 { font-size: 1.5rem; margin: 1.5rem 0 0.5rem; }
      p { color: var(--soft); margin: 0.5rem 0; }
    </style>
  </head>
  <body>
    <main>
      <p class="marca" aria-hidden="true">La Taba</p>
      <h1>Estamos preparando la tienda</h1>
      <p>La tienda online está en mantenimiento. Pronto vas a poder hacer tus pedidos acá.</p>
      <p>Desde esta página no se toman pedidos ni se cobra nada.</p>
    </main>
  </body>
</html>
