<!doctype html>
<html lang="es-AR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>TABA — Panel del negocio móvil (prototipo)</title>
<link rel="stylesheet" href="prototype-shared.css">
<style>
  body { background: var(--taba-surface-sunken); padding-bottom: 32px; }

  .biz-head {
    position: sticky; top: 0; z-index: 50;
    display: flex; align-items: center; justify-content: space-between;
    min-height: 56px; padding: 0 var(--space-4);
    background: var(--taba-surface-inverse);
  }
  .biz-head .role {
    font-size: var(--text-micro); font-weight: 800;
    letter-spacing: var(--tracking-caps); text-transform: uppercase;
    color: rgb(255 255 255 / 72%);
  }

  .statusbar {
    display: flex; align-items: center; justify-content: space-between; gap: var(--space-3);
    min-height: 40px; padding: 0 var(--space-4);
    background: var(--taba-surface);
    border-bottom: 1px solid var(--taba-border);
  }
  .statusbar .date { font-size: var(--text-meta); font-weight: 700; }
  .statusbar .right { display: flex; align-items: center; gap: var(--space-2); }
  .sound-btn {
    position: relative;
    width: var(--tap); height: var(--tap);
    display: grid; place-items: center;
    border: 0; background: none; color: var(--taba-graphite);
  }
  .sound-btn svg { width: 20px; height: 20px; }
  .sound-btn .badge {
    position: absolute; top: 4px; right: 2px;
    min-width: 17px; height: 17px; padding: 0 4px;
    display: grid; place-items: center;
    border-radius: var(--radius-pill);
    background: var(--taba-red); color: #fff;
    font-size: var(--text-caps); font-weight: 900;
  }

  .shell { padding: var(--space-4); display: grid; gap: 0; }

  .sec-head {
    display: flex; align-items: baseline; justify-content: space-between;
    margin: var(--space-6) 0 var(--space-2);
  }
  .sec-head h2 { font-size: var(--text-title); font-weight: 850; letter-spacing: -.02em; }
  .sec-head .n {
    min-width: 22px; height: 22px; padding: 0 7px;
    display: inline-grid; place-items: center;
    border-radius: var(--radius-pill);
    background: var(--taba-red); color: #fff;
    font-size: var(--text-micro); font-weight: 900;
  }

  .orders { display: grid; gap: var(--space-3); }

  @media (min-width: 600px) {
    .shell { max-width: 760px; margin-inline: auto; }
    .orders { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .groups { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 0 var(--space-4); }
  }
  @media (max-width: 350px) {
    .shell { padding: var(--space-3); }
    .ops-cell strong { font-size: 20px; }
    .order-actions { flex-wrap: wrap; }
    .order-actions .btn-primary { flex: 1 0 100%; }
  }
</style>
</head>
<body>

<header class="biz-head">
  <span class="brand-mark"><span class="brand-word">TABA</span></span>
  <span class="role">Operación del local</span>
</header>

<div class="statusbar">
  <span class="date">jue 30 de julio</span>
  <span class="right">
    <span class="sync-chip is-live" aria-live="polite">Sincronizado · 12:04</span>
    <button class="sound-btn" type="button" aria-pressed="true" aria-label="Aviso sonoro activo, 3 pedidos nuevos">
      <svg viewBox="0 0 24 24" fill="none"><path d="M5 9v6h3.5L13 19V5L8.5 9H5Z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><path d="M16.5 9.5a4 4 0 0 1 0 5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
      <span class="badge">3</span>
    </button>
  </span>
</div>

<div class="shell">

  <!-- Resumen operativo: 4 columnas en 64px. Hoy son 4 fichas 2x2 en ~390px. -->
  <div class="ops-summary" role="group" aria-label="Cola operativa">
    <button class="ops-cell ops-new" type="button" aria-pressed="false">
      <strong>3</strong><span>Nuevos</span>
    </button>
    <button class="ops-cell ops-prep" type="button" aria-pressed="false">
      <strong>2</strong><span>Preparación</span>
    </button>
    <button class="ops-cell ops-ready" type="button" aria-pressed="false">
      <strong>1</strong><span>Listos</span>
    </button>
    <button class="ops-cell ops-transit" type="button" aria-pressed="false">
      <strong>2</strong><span>En camino</span>
    </button>
  </div>

  <div class="sec-head">
    <h2>Pedidos nuevos</h2>
    <span class="n">3</span>
  </div>

  <div class="orders">
    <article class="order-card">
      <div class="order-row">
        <span class="order-id">#1042</span>
        <span class="order-time">hace 2 min</span>
      </div>
      <div class="order-who">Cliente D. · Delivery</div>
      <div class="order-row">
        <span class="order-who">3 productos</span>
        <span class="order-total">$ 51.300</span>
      </div>
      <div class="order-actions">
        <button class="btn btn-primary" type="button">Aceptar</button>
        <button class="btn btn-ghost" type="button">Ver ›</button>
      </div>
    </article>

    <!-- Sólo el pedido más antiguo lleva la acción primaria llena. El resto usa
         secundaria: una sola superficie roja dominante por pantalla. -->
    <article class="order-card">
      <div class="order-row">
        <span class="order-id">#1041</span>
        <span class="order-time">hace 6 min</span>
      </div>
      <div class="order-who">Cliente M. · Retiro en local</div>
      <div class="order-row">
        <span class="order-who">1 producto</span>
        <span class="order-total">$ 17.100</span>
      </div>
      <div class="order-actions">
        <button class="btn btn-secondary" type="button">Aceptar</button>
        <button class="btn btn-ghost" type="button">Ver ›</button>
      </div>
    </article>

    <article class="order-card">
      <div class="order-row">
        <span class="order-id">#1040</span>
        <span class="order-time">hace 14 min</span>
      </div>
      <div class="order-who">Cliente R. · Delivery</div>
      <div class="order-row">
        <span class="order-who">5 productos</span>
        <span class="order-total">$ 41.900</span>
      </div>
      <div class="order-actions">
        <button class="btn btn-secondary" type="button">Aceptar</button>
        <button class="btn btn-ghost" type="button">Ver ›</button>
      </div>
    </article>
  </div>

  <div class="groups">
    <section>
      <h3 class="group-label">Operación</h3>
      <div class="taba-group">
        <button class="taba-row" type="button">
          <span class="taba-row-ico"><svg viewBox="0 0 24 24" fill="none"><path d="M5 6h14M5 12h14M5 18h9" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg></span>
          <span class="taba-row-title">Pedidos</span>
          <span class="taba-row-state">8 hoy</span>
          <span class="taba-row-chev" aria-hidden="true">›</span>
        </button>
        <button class="taba-row" type="button">
          <span class="taba-row-ico"><svg viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="8" stroke="currentColor" stroke-width="1.8"/><path d="M12 8v4.4l2.8 1.7" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg></span>
          <span class="taba-row-title">En preparación</span>
          <span class="taba-row-state">2</span>
          <span class="taba-row-chev" aria-hidden="true">›</span>
        </button>
        <button class="taba-row" type="button">
          <span class="taba-row-ico"><svg viewBox="0 0 24 24" fill="none"><path d="M3 16V7h11v9M14 10h4l3 3v3h-7" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/><circle cx="7" cy="17.5" r="1.8" stroke="currentColor" stroke-width="1.6"/><circle cx="17" cy="17.5" r="1.8" stroke="currentColor" stroke-width="1.6"/></svg></span>
          <span class="taba-row-title">Rider</span>
          <span class="taba-row-state">1 activo</span>
          <span class="taba-row-chev" aria-hidden="true">›</span>
        </button>
      </div>
    </section>

    <section>
      <h3 class="group-label">Negocio</h3>
      <div class="taba-group">
        <button class="taba-row" type="button">
          <span class="taba-row-ico"><svg viewBox="0 0 24 24" fill="none"><rect x="4" y="5" width="16" height="14" rx="2" stroke="currentColor" stroke-width="1.7"/><path d="M4 10h16" stroke="currentColor" stroke-width="1.7"/></svg></span>
          <span class="taba-row-title">Catálogo</span>
          <span class="taba-row-state">22 activos</span>
          <span class="taba-row-chev" aria-hidden="true">›</span>
        </button>
        <button class="taba-row" type="button">
          <span class="taba-row-ico"><svg viewBox="0 0 24 24" fill="none"><path d="M4 8.5 12 4l8 4.5v7L12 20l-8-4.5Z" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/></svg></span>
          <span class="taba-row-title">Stock</span>
          <span class="taba-row-state attention">3 bajos</span>
          <span class="taba-row-chev" aria-hidden="true">›</span>
        </button>
        <button class="taba-row" type="button">
          <span class="taba-row-ico"><svg viewBox="0 0 24 24" fill="none"><rect x="3" y="6" width="18" height="12" rx="2" stroke="currentColor" stroke-width="1.7"/><circle cx="12" cy="12" r="2.4" stroke="currentColor" stroke-width="1.7"/></svg></span>
          <span class="taba-row-title">Caja</span>
          <span class="taba-row-state">Abierta</span>
          <span class="taba-row-chev" aria-hidden="true">›</span>
        </button>
      </div>
    </section>

    <section>
      <h3 class="group-label">Análisis</h3>
      <div class="taba-group">
        <button class="taba-row" type="button">
          <span class="taba-row-ico"><svg viewBox="0 0 24 24" fill="none"><path d="M5 19V11M12 19V5M19 19v-5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg></span>
          <span class="taba-row-title">Métricas</span>
          <span class="taba-row-state">$ 124.500 hoy</span>
          <span class="taba-row-chev" aria-hidden="true">›</span>
        </button>
        <button class="taba-row" type="button">
          <span class="taba-row-ico"><svg viewBox="0 0 24 24" fill="none"><path d="M7 4h7l4 4v12H7Z" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/><path d="M10 13h6M10 16h4" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg></span>
          <span class="taba-row-title">Reportes</span>
          <span class="taba-row-state">Julio</span>
          <span class="taba-row-chev" aria-hidden="true">›</span>
        </button>
        <button class="taba-row" type="button">
          <span class="taba-row-ico"><svg viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="3" stroke="currentColor" stroke-width="1.7"/><path d="M12 3v3M12 18v3M3 12h3M18 12h3M5.6 5.6l2.1 2.1M16.3 16.3l2.1 2.1M18.4 5.6l-2.1 2.1M7.7 16.3l-2.1 2.1" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg></span>
          <span class="taba-row-title">Configuración</span>
          <span class="taba-row-state"></span>
          <span class="taba-row-chev" aria-hidden="true">›</span>
        </button>
      </div>
    </section>
  </div>

</div>
</body>
</html>
