<div style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:16px;line-height:1.5;color:#111;max-width:520px">
  <h2 style="font-size:20px;margin:0 0 12px">Cambiá tu contraseña</h2>
  <p style="margin:0 0 12px">Pediste cambiar la contraseña de tu cuenta de <strong>La Taba</strong>.</p>
  <p style="margin:0 0 20px">
    <a href="{{ .SiteURL }}/cuenta/?token_hash={{ .TokenHash }}&type=recovery"
       style="display:inline-block;padding:12px 20px;background:#d71920;color:#fff;text-decoration:none;border-radius:8px;font-weight:600">Elegir una contraseña nueva</a>
  </p>
  <p style="margin:0 0 12px;color:#555">El enlace sirve una sola vez y vence en una hora.</p>
  <p style="margin:0;color:#555">Si no lo pediste vos, no hagas nada: tu contraseña actual sigue funcionando.</p>
</div>
